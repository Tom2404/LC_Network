<!DOCTYPE html>
<html class="light" lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Thông báo | LC Network</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#11d4c4",
                        "background-light": "#f6f8f8",
                        "background-dark": "#102220",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Manrope', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Notification Animation */
        @keyframes slideInRight {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }

        .notification-enter {
            animation: slideInRight 0.3s ease-out forwards;
        }

        .notification-exit {
            animation: slideOutRight 0.3s ease-in forwards;
        }

        /* Modal Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-enter {
            animation: fadeIn 0.2s ease-out;
        }

        .modal-content-enter {
            animation: scaleIn 0.3s ease-out;
        }

        /* Search Filter Active State */
        .search-filter-active {
            background: white;
            color: #38a89d;
            border-bottom: 3px solid #38a89d;
        }

        .dark .search-filter-active {
            background: #152a28;
            color: #38a89d;
        }

        /* Notification List Animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .notification-item {
            animation: fadeInUp 0.3s ease-out;
        }

        /* Pulse animation for unread notifications */
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        .unread-indicator {
            animation: pulse 2s ease-in-out infinite;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen">
    <!-- Search Dropdown -->
    <div id="searchDropdown" class="fixed top-16 left-1/2 -translate-x-1/2 z-[9997] hidden w-full max-w-2xl">
        <div class="bg-white dark:bg-[#152a28] rounded-xl shadow-2xl border-2 border-[#dae7e6] dark:border-[#2a3d3b] overflow-hidden max-h-[70vh] mx-4">
            <!-- Search Filters -->
            <div class="flex border-b border-[#dae7e6] dark:border-[#2a3d3b] bg-[#f0f5f4] dark:bg-[#1a3330]">
                <button onclick="setSearchFilter('all')" id="searchFilterAll" class="flex-1 px-4 py-3 text-sm font-semibold transition-colors search-filter-active">
                    Tất cả
                </button>
                <button onclick="setSearchFilter('people')" id="searchFilterPeople" class="flex-1 px-4 py-3 text-sm font-semibold transition-colors text-[#5e8d89] hover:bg-white dark:hover:bg-[#152a28]">
                    Người dùng
                </button>
                <button onclick="setSearchFilter('posts')" id="searchFilterPosts" class="flex-1 px-4 py-3 text-sm font-semibold transition-colors text-[#5e8d89] hover:bg-white dark:hover:bg-[#152a28]">
                    Bài viết
                </button>
            </div>
            
            <!-- Search Results Container -->
            <div id="searchResultsContainer" class="overflow-y-auto max-h-[60vh]">
                <div class="p-8 text-center text-[#5e8d89]">
                    <span class="material-symbols-outlined text-4xl mb-2 opacity-50">search</span>
                    <p class="text-sm">Nhập từ khóa để tìm kiếm</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="notification" class="fixed top-4 right-4 z-[9999] hidden">
        <div class="bg-white dark:bg-[#152a28] border-2 border-primary dark:border-primary rounded-lg shadow-2xl p-4 min-w-[320px] max-w-md">

                <span id="notificationIcon" class="material-symbols-outlined text-2xl"></span>

                <button onclick="hideNotification()" class="text-[#5e8d89] hover:text-[#101818] dark:hover:text-white">

                </button>

        </div>
    </div>

        <!-- Modal Content -->

                <!-- Header -->
                <div class="bg-gradient-to-r from-primary/10 to-primary/5 p-6 border-b border-[#dae7e6] dark:border-[#2a3d3b]">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-3xl text-primary">logout</span>
                        <h3 class="text-xl font-bold dark:text-white">Xác nhận đăng xuất</h3>
                    </div>
                </div>
                
                <!-- Body -->
                <div class="p-6">
                    <p class="text-[#5e8d89] dark:text-gray-300 leading-relaxed">
                        Bạn có chắc chắn muốn đăng xuất khỏi tài khoản? Bạn sẽ cần đăng nhập lại để tiếp tục sử dụng dịch vụ.
                    </p>
                </div>
                
                <!-- Footer -->
                <div class="px-6 pb-6 flex gap-3">
                    <button onclick="closeLogoutModal()" class="flex-1 px-6 py-3 bg-[#f0f5f4] dark:bg-[#1a3330] text-[#5e8d89] rounded-lg font-bold text-sm hover:bg-[#dae7e6] dark:hover:bg-[#2a3d3b] transition-colors">
                        Hủy

                    <button onclick="confirmLogout()" class="flex-1 px-6 py-3 bg-red-500 text-white rounded-lg font-bold text-sm hover:bg-red-600 transition-colors shadow-md">
                        Đăng xuất
                    </button>
                </div>
            </div>
        </div>
    </div>

ill="currentColor" fill-rule="evenodd"></path>
                    </svg>
                </div>
                <h2 class="text-lg font-extrabold tracking-tight hidden sm:block">LC Network</h2>
            </a>
            <!-- Navigation Links -->
            <nav class="hidden lg:flex items-center gap-6">
                <a class="text-sm font-semibold hover:text-primary transition-colors" href="index.html">Trang chủ</a>

    <!-- Main Content -->
    <main class="max-w-[800px] mx-auto px-4 md:px-6 py-8">
        <div class="mb-8 flex items-center justify-between">
            <div>
                <h2 class="text-3xl font-bold mb-2">Thông báo</h2>
                <p class="text-slate-500 dark:text-slate-400">Các hoạt động và cập nhật mới nhất</p>
            </div>
            <button onclick="markAllAsRead()" class="px-4 py-2 text-sm font-semibold text-primary hover:bg-primary/10 rounded-lg transition-colors">
                Đánh dấu đã đọc tất cả
            </button>
        </div>

        <!-- Tabs -->
        <div class="flex gap-4 border-b border-slate-200 dark:border-slate-800 mb-6 overflow-x-auto">
            <button onclick="switchTab('all')" id="tabAll" class="px-6 py-3 text-sm font-bold text-primary border-b-2 border-primary whitespace-nowrap">
                Tất cả
            </button>
            <button onclick="switchTab('account')" id="tabAccount" class="px-6 py-3 text-sm font-bold text-slate-400 hover:text-primary transition-colors border-b-2 border-transparent whitespace-nowrap flex items-center gap-2">
                <span class="material-symbols-outlined text-lg">mail</span>

        </div>

    <!-- Scripts -->
    <script src="/user/js/config.js"></script>
    <script src="/user/js/auth.js"></script>
    <script src="/user/js/search.js"></script>
    <script>
        // Toast Notification System
        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            const icon = document.getElementById('notificationIcon');
            const messageEl = document.getElementById('notificationMessage');
            
            const types = {
                success: { icon: 'check_circle', color: 'text-green-500' },
                error: { icon: 'error', color: 'text-red-500' },
                warning: { icon: 'warning', color: 'text-yellow-500' },
                info: { icon: 'info', color: 'text-primary' }
            };
            
            const config = types[type] || types.info;
            icon.textContent = config.icon;
            icon.className = `material-symbols-outlined text-2xl ${config.color}`;
            messageEl.textContent = message;
            
            notification.classList.remove('hidden', 'notification-exit');
            notification.classList.add('notification-enter');
            
            setTimeout(() => hideNotification(), 5000);
        }
        
        function hideNotification() {
            const notification = document.getElementById('notification');
            notification.classList.remove('notification-enter');
            notification.classList.add('notification-exit');
            setTimeout(() => notification.classList.add('hidden'), 300);
        }

        // Logout Modal Functions
        function openLogoutModal() {
            const modal = document.getElementById('logoutModal');
            modal.classList.remove('hidden');
            modal.classList.add('modal-enter');
            
            const modalContent = modal.querySelector('.bg-white');
            modalContent.classList.add('modal-content-enter');
            
            document.body.style.overflow = 'hidden';
        }

        function closeLogoutModal() {
            const modal = document.getElementById('logoutModal');
            modal.classList.add('hidden');
            document.body.style.overflow = '';
        }

        function confirmLogout() {
            closeLogoutModal();
            logout();
        }

        // Track current tab for auto-refresh
        let currentTab = 'all';

        function getNotificationsEndpoint(filter = 'all') {
            // Use trailing slash to match Flask route and avoid redirect edge cases.
            const base = `${API_URL}/notifications/`;
            if (filter === 'account') return `${base}?category=account`;
            if (filter === 'post') return `${base}?category=post`;
            return base;
        }

        // Tab switching
        function switchTab(tab) {
            // Reset all tabs
            ['tabAccount', 'tabPost', 'tabAll'].forEach(tabId => {
                const tabEl = document.getElementById(tabId);
                tabEl.classList.remove('text-primary', 'border-primary');
                tabEl.classList.add('text-slate-400', 'border-transparent');
            });
            
            // Activate selected tab
            const activeTabId = tab === 'account' ? 'tabAccount' : tab === 'post' ? 'tabPost' : 'tabAll';
            const activeTab = document.getElementById(activeTabId);
            activeTab.classList.remove('text-slate-400', 'border-transparent');
            activeTab.classList.add('text-primary', 'border-primary');
            
            // Update current tab
            currentTab = tab;
            
            loadNotifications(tab);
        }

        // Load notifications
        async function loadNotifications(filter = 'all') {
            const container = document.getElementById('notificationsContent');
            
            try {
                const url = getNotificationsEndpoint(filter);
                const response = await fetchWithAuth(url);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('Notifications loaded:', data);
                    
                    // Clear container
                    container.innerHTML = '';
                    
                    if (Array.isArray(data.notifications) && data.notifications.length > 0) {
                        data.notifications.forEach(notif => {
                            container.appendChild(renderNotification(notif));
                        });
                    } else {
                        const emptyIcon = filter === 'account' ? 'mail_outline' : filter === 'post' ? 'notifications_off' : 'notifications_off';
                        const emptyText = filter === 'account' ? 'Chưa có thông báo về tài khoản' : filter === 'post' ? 'Chưa có thông báo về bài viết' : 'Chưa có thông báo nào';
                        container.innerHTML = `
                            <div class="text-center py-12 text-slate-400">
                                <span class="material-symbols-outlined text-6xl mb-3">${emptyIcon}</span>
                                <p>${emptyText}</p>
                            </div>
                        `;
                    }
                } else {
                    let errorDetail = '';
                    try {
                        const errorData = await response.json();
                        errorDetail = errorData?.error || '';
                    } catch (err) {
                        errorDetail = '';
                    }
                    console.error('Failed to load notifications:', response.status, errorDetail);
                    container.innerHTML = '<div class="text-center py-8 text-red-500 text-sm">Không thể tải thông báo</div>';
                }
            } catch (error) {
                console.error('Error loading notifications:', error);
                container.innerHTML = '<div class="text-center py-8 text-red-500 text-sm">Lỗi kết nối</div>';
            }
        }
        
        // Render a single notification
        function renderNotification(notif) {
            const div = document.createElement('div');
            const isUnread = !notif.is_read;
            
            // Add animation class
            div.classList.add('notification-item');
            
            // Get icon and color based on type
            let icon = 'notifications';
            let iconColor = 'text-primary';
            
            // Post notifications (likes, comments, shares, moderation)
            if (notif.category === 'post') {
                switch(notif.type) {
                    case 'like':
                        icon = 'favorite';
                        iconColor = 'text-red-500';
                        break;
                    case 'comment':
                        icon = 'chat_bubble';
                        iconColor = 'text-blue-500';
                        break;
                    case 'reply':
                        icon = 'reply';
                        iconColor = 'text-sky-500';
                        break;
                    case 'share':
                        icon = 'share';
                        iconColor = 'text-green-500';
                        break;
                    case 'post_approved':
                        icon = 'check_circle';
                        iconColor = 'text-green-500';
                        break;
                    case 'post_rejected':
                        icon = 'block';
                        iconColor = 'text-red-500';
                        break;
                    case 'post_flagged':
                        icon = 'flag';
                        iconColor = 'text-orange-500';
                        break;
                    default:
                        icon = 'notifications';
                        iconColor = 'text-primary';
                }
            } 
            // Account notifications (friend requests, account status)
            else {
                switch(notif.type) {
                    case 'friend_request':
                        icon = 'person_add';
                        iconColor = 'text-purple-500';
                        break;
                    case 'friend_accept':
                        icon = 'group';
                        iconColor = 'text-green-500';
                        break;
                    case 'account_suspended':
                    case 'account_banned':
                        icon = 'lock';
                        iconColor = 'text-red-600';
                        break;
                    case 'account_warning':
                    case 'violation_warning':
                        icon = 'warning';
                        iconColor = 'text-yellow-500';
                        break;
                    case 'appeal_result':
                        icon = 'mail';
                        iconColor = 'text-blue-500';
                        break;
                    default:
                        icon = 'mail';
                        iconColor = 'text-blue-500';
                }
            }
            
            // Fix avatar URL construction
            const baseURL = API_URL.replace('/api', '');
            const actorAvatar = notif.actor?.avatar_url 
                ? (notif.actor.avatar_url.startsWith('http') ? notif.actor.avatar_url : baseURL + notif.actor.avatar_url)
                : '/user/images/default-avatar.png';
            
            const timeAgo = getTimeAgo(notif.created_at);
            
            div.className = `flex gap-4 p-4 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors ${notif.type === 'friend_request' ? '' : 'cursor-pointer'} ${isUnread ? 'bg-primary/5' : ''}`;
            
            // Only add click handler if not friend_request
            if (notif.type !== 'friend_request') {
                div.onclick = () => markAsRead(notif.id);
            }
            
            div.innerHTML = `
                <div class="relative flex-shrink-0">
                    <div class="w-12 h-12 rounded-full bg-cover bg-center border-2 border-slate-200 dark:border-slate-700" style="background-image: url('${actorAvatar}')"></div>
                    <div class="absolute -bottom-1 -right-1 w-6 h-6 bg-white dark:bg-slate-900 rounded-full flex items-center justify-center border-2 border-white dark:border-slate-900 shadow-sm">
                        <span class="material-symbols-outlined text-sm ${iconColor}">${icon}</span>
                    </div>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm dark:text-white font-semibold mb-1 ${isUnread ? 'text-slate-900' : 'text-slate-700'}">${notif.title || 'Thông báo'}</p>
                    <p class="text-xs text-slate-600 dark:text-slate-400 mb-1">${notif.message}</p>
                    <p class="text-xs text-slate-500 dark:text-slate-500">${timeAgo}</p>
                    ${notif.type === 'friend_request' && notif.actor ? `
                        <div class="flex gap-2 mt-3">
                            <button onclick="acceptFriendRequest(${notif.actor.id}, ${notif.id}); event.stopPropagation();" class="flex-1 px-4 py-2 bg-primary text-white rounded-lg font-semibold text-xs hover:bg-primary/90 transition-colors">
                                Chấp nhận
                            </button>
                            <button onclick="rejectFriendRequest(${notif.actor.id}, ${notif.id}); event.stopPropagation();" class="flex-1 px-4 py-2 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-lg font-semibold text-xs hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors">
                                Từ chối
                            </button>
                        </div>
                    ` : ''}
                </div>
                ${isUnread ? '<div class="w-2 h-2 bg-primary rounded-full mt-2 flex-shrink-0 unread-indicator"></div>' : ''}
            `;
            
            return div;
        }
        
        // Get time ago
        function getTimeAgo(dateString) {
            if (!dateString || typeof dateString !== 'string') {
                return 'Vừa xong';
            }

            // Parse date as UTC (server trả về UTC time)
            let utcDateString = dateString;
            if (!dateString.endsWith('Z') && !dateString.includes('+') && !dateString.includes('T')) {
                utcDateString = dateString.replace(' ', 'T') + 'Z';
            } else if (!dateString.endsWith('Z') && dateString.includes('T')) {
                utcDateString = dateString + 'Z';
            }
            
            const date = new Date(utcDateString);
            if (Number.isNaN(date.getTime())) {
                return 'Vừa xong';
            }

            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);
            
            if (seconds < 60) return 'Vừa xong';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} phút trước`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} giờ trước`;
            const days = Math.floor(hours / 24);
            if (days < 30) return `${days} ngày trước`;
            const months = Math.floor(days / 30);
            if (months < 12) return `${months} tháng trước`;
            const years = Math.floor(days / 365);
            return `${years} năm trước`;
        }
        
        // Mark notification as read
        async function markAsRead(notificationId) {
            try {
                const response = await fetchWithAuth(`${API_URL}/notifications/${notificationId}/read`, {
                    method: 'POST'
                });
                
                if (response.ok) {
                    // Reload to update UI - determine current tab
                    const tabs = ['tabAccount', 'tabPost', 'tabAll'];
                    let currentTab = 'account'; // default
                    
                    for (const tabId of tabs) {
                        const tab = document.getElementById(tabId);
                        if (tab.classList.contains('text-primary')) {
                            if (tabId === 'tabAccount') currentTab = 'account';
                            else if (tabId === 'tabPost') currentTab = 'post';
                            else currentTab = 'all';
                            break;
                        }
                    }
                    
                    loadNotifications(currentTab);
                }
            } catch (error) {
                console.error('Error marking as read:', error);
            }
        }

        // Mark all as read
        async function markAllAsRead() {
            try {
                const response = await fetchWithAuth(`${API_URL}/notifications/mark-all-read`, {
                    method: 'POST'
                });
                
                if (response.ok) {
                    showNotification('Đã đánh dấu tất cả thông báo là đã đọc', 'success');
                    
                    // Reload current tab
                    const tabs = ['tabAccount', 'tabPost', 'tabAll'];
                    let currentTab = 'account';
                    
                    for (const tabId of tabs) {
                        const tab = document.getElementById(tabId);
                        if (tab.classList.contains('text-primary')) {
                            if (tabId === 'tabAccount') currentTab = 'account';
                            else if (tabId === 'tabPost') currentTab = 'post';
                            else currentTab = 'all';
                            break;
                        }
                    }
                    
                    loadNotifications(currentTab);
                } else {
                    showNotification('Không thể đánh dấu đã đọc', 'error');
                }
            } catch (error) {
                console.error('Error marking as read:', error);
                showNotification('Lỗi kết nối', 'error');
            }
        }

        // Accept friend request
        async function acceptFriendRequest(userId, notificationId) {
            try {
                const response = await fetchWithAuth(`${API_URL}/friends/request/${userId}/accept`, {
                    method: 'POST'
                });
                
                if (response.ok) {
                    showNotification('Đã chấp nhận lời mời kết bạn', 'success');
                    // Mark notification as read
                    await markAsRead(notificationId);
                } else {
                    const data = await response.json();
                    showNotification(data.error || 'Không thể chấp nhận lời mời', 'error');
                }
            } catch (error) {
                console.error('Error accepting friend request:', error);
                showNotification('Lỗi kết nối', 'error');
            }
        }

        // Reject friend request
        async function rejectFriendRequest(userId, notificationId) {
            try {
                const response = await fetchWithAuth(`${API_URL}/friends/request/${userId}/reject`, {
                    method: 'POST'
                });
                
                if (response.ok) {
                    showNotification('Đã từ chối lời mời kết bạn', 'success');
                    // Mark notification as read
                    await markAsRead(notificationId);
                } else {
                    const data = await response.json();
                    showNotification(data.error || 'Không thể từ chối lời mời', 'error');
                }
            } catch (error) {
                console.error('Error rejecting friend request:', error);
                showNotification('Lỗi kết nối', 'error');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (user.avatar_url) {
                const baseURL = API_URL.replace('/api', '');
                const avatarUrl = user.avatar_url.startsWith('http') ? user.avatar_url : `${baseURL}${user.avatar_url}`;
                document.getElementById('headerAvatar').style.backgroundImage = `url('${avatarUrl}')`;
            }

            // Sync initial tab with query string used by links in other pages.
            const tabParam = new URLSearchParams(window.location.search).get('tab');
            const initialTab = ['all', 'account', 'post'].includes(tabParam) ? tabParam : 'all';
            switchTab(initialTab);

            setupSearch();
            
            // Auto-refresh notifications every 15 seconds
            setInterval(() => {
                loadNotifications(currentTab);
            }, 15000);
        });
    </script>
</body>
