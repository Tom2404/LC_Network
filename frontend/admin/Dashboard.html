<!DOCTYPE html>
<html class="light" lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Tổng quan | LC Network</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#11d4c4",
                        "primary-dark": "#0fb9aa",
                        "background-light": "#f6f8f8",
                        "background-dark": "#102220",
                        "success": "#28a745",
                        "warning": "#ffc107",
                        "danger": "#dc3545",
                        "muted": "#6c757d"
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.375rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Manrope', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        .active-link {
            background: linear-gradient(135deg, rgba(17, 212, 196, 0.1) 0%, rgba(17, 212, 196, 0.15) 100%);
            color: #11d4c4;
            border-right: 3px solid #11d4c4;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #11d4c4 0%, #0fb9aa 100%);
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">
    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col shrink-0">
            <div class="p-6 flex items-center gap-3">
                <div class="size-10 text-primary">
                    <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                        <path d="M13.8261 30.5736C16.7203 29.8826 20.2244 29.4783 24 29.4783C27.7756 29.4783 31.2797 29.8826 34.1739 30.5736C36.9144 31.2278 39.9967 32.7669 41.3563 33.8352L24.8486 7.36089C24.4571 6.73303 23.5429 6.73303 23.1514 7.36089L6.64374 33.8352C8.00331 32.7669 11.0856 31.2278 13.8261 30.5736Z" fill="currentColor"></path>
                        <path clip-rule="evenodd" d="M39.998 35.764C39.9944 35.7463 39.9875 35.7155 39.9748 35.6706C39.9436 35.5601 39.8949 35.4259 39.8346 35.2825C39.8168 35.2403 39.7989 35.1993 39.7813 35.1602C38.5103 34.2887 35.9788 33.0607 33.7095 32.5189C30.9875 31.8691 27.6413 31.4783 24 31.4783C20.3587 31.4783 17.0125 31.8691 14.2905 32.5189C12.0012 33.0654 9.44505 34.3104 8.18538 35.1832C8.17384 35.2075 8.16216 35.233 8.15052 35.2592C8.09919 35.3751 8.05721 35.4886 8.02977 35.589C8.00356 35.6848 8.00039 35.7333 8.00004 35.7388C8.00004 35.739 8 35.7393 8.00004 35.7388C8.00004 35.7641 8.0104 36.0767 8.68485 36.6314C9.34546 37.1746 10.4222 37.7531 11.9291 38.2772C14.9242 39.319 19.1919 40 24 40C28.8081 40 33.0758 39.319 36.0709 38.2772C37.5778 37.7531 38.6545 37.1746 39.3151 36.6314C39.9006 36.1499 39.9857 35.8511 39.998 35.764ZM4.95178 32.7688L21.4543 6.30267C22.6288 4.4191 25.3712 4.41909 26.5457 6.30267L43.0534 32.777C43.0709 32.8052 43.0878 32.8338 43.104 32.8629L41.3563 33.8352C43.104 32.8629 43.1038 32.8626 43.104 32.8629L43.1051 32.865L43.1065 32.8675L43.1101 32.8739L43.1199 32.8918C43.1276 32.906 43.1377 32.9246 43.1497 32.9473C43.1738 32.9925 43.2062 33.0545 43.244 33.1299C43.319 33.2792 43.4196 33.489 43.5217 33.7317C43.6901 34.1321 44 34.9311 44 35.7391C44 37.4427 43.003 38.7775 41.8558 39.7209C40.6947 40.6757 39.1354 41.4464 37.385 42.0552C33.8654 43.2794 29.133 44 24 44C18.867 44 14.1346 43.2794 10.615 42.0552C8.86463 41.4464 7.30529 40.6757 6.14419 39.7209C4.99695 38.7775 3.99999 37.4427 3.99999 35.7391C3.99999 34.8725 4.29264 34.0922 4.49321 33.6393C4.60375 33.3898 4.71348 33.1804 4.79687 33.0311C4.83898 32.9556 4.87547 32.8935 4.9035 32.8471C4.91754 32.8238 4.92954 32.8043 4.93916 32.7889L4.94662 32.777L4.95178 32.7688ZM35.9868 29.004L24 9.77997L12.0131 29.004C12.4661 28.8609 12.9179 28.7342 13.3617 28.6282C16.4281 27.8961 20.0901 27.4783 24 27.4783C27.9099 27.4783 31.5719 27.8961 34.6383 28.6282C35.082 28.7342 35.5339 28.8609 35.9868 29.004Z" fill="currentColor" fill-rule="evenodd"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">LC Network</h1>
                    <p class="text-xs text-muted">Tổng quan</p>
                </div>
            </div>
            <nav class="flex-1 px-4 space-y-1 mt-4">
                <a class="flex items-center gap-3 px-3 py-3 rounded-lg active-link" href="/admin/dashboard">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">dashboard</span>
                    <span class="text-sm font-semibold">Tổng quan</span>
                </a>
                <a class="flex items-center gap-3 px-3 py-3 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors" href="/admin/">
                    <span class="material-symbols-outlined">article</span>
                    <span class="text-sm font-medium">Quản lí bài viết</span>
                </a>
                <a class="flex items-center gap-3 px-3 py-3 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors" href="/admin/users">
                    <span class="material-symbols-outlined">group</span>
                    <span class="text-sm font-medium">Quản lí người dùng</span>
                </a>
                <a class="flex items-center gap-3 px-3 py-3 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors" href="/admin/content-queue">
                    <span class="material-symbols-outlined">pending_actions</span>
                    <span class="text-sm font-medium">Quản lí bài viết</span>
                    <span class="ml-auto bg-warning text-white text-[10px] px-2 py-0.5 rounded-full" id="queueCount">0</span>
                </a>
                <a class="flex items-center gap-3 px-3 py-3 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors" href="/admin/reports">
                    <span class="material-symbols-outlined">report</span>
                    <span class="text-sm font-medium">Báo cáo Vi phạm</span>
                </a>
            </nav>
            <div class="p-4 border-t border-slate-200 dark:border-slate-800">
                <div class="flex items-center gap-3 p-2">
                    <div class="w-10 h-10 rounded-full gradient-bg flex items-center justify-center text-white font-bold">
                        <span id="adminInitials">A</span>
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <p class="text-sm font-bold truncate" id="adminFullName">Quản trị viên</p>
                        <p class="text-xs text-muted truncate" id="adminRole">Admin</p>
                    </div>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-8 shrink-0">
                <h2 class="text-xl font-bold">Tổng quan</h2>
                <div class="flex items-center gap-4">
                    <button class="p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg" onclick="loadDashboard()">
                        <span class="material-symbols-outlined text-2xl">refresh</span>
                    </button>
                    <button class="p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg" onclick="logout(); return false;" title="Đăng xuất">
                        <span class="material-symbols-outlined text-2xl">logout</span>
                    </button>
                    <button class="p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg" onclick="toggleDarkMode()">
                        <span class="material-symbols-outlined text-2xl" id="darkModeIcon">dark_mode</span>
                    </button>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-8" id="mainContent">
                <div class="text-center py-16">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mx-auto"></div>
                    <p class="text-muted mt-4">Đang tải dữ liệu tổng quan...</p>
                </div>
            </div>
        </main>
    </div>

    <div id="post-modal" class="modal-overlay fixed inset-0 bg-black/50 z-50 flex items-center justify-center" style="display: none;">
        <div class="bg-white dark:bg-slate-900 rounded-lg shadow-xl max-w-4xl w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-6 py-4 flex items-center justify-between">
                <h3 class="text-lg font-bold">Chi tiết bài viết</h3>
                <button onclick="closePostModal()" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div id="post-detail-content" class="p-6"></div>
            <div class="sticky bottom-0 bg-slate-50 dark:bg-slate-800/50 px-6 py-4 flex items-center justify-end gap-3 border-t border-slate-200 dark:border-slate-800">
                <button onclick="closePostModal()" class="px-4 py-2 text-sm text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg">Đóng</button>
                <button onclick="approvePost()" class="px-4 py-2 text-sm bg-success text-white rounded-lg hover:bg-success/90">
                    <span class="material-symbols-outlined text-sm align-middle">check_circle</span>
                    Duyệt bài
                </button>
                <button onclick="rejectPost()" class="px-4 py-2 text-sm bg-warning text-white rounded-lg hover:bg-warning/90">
                    <span class="material-symbols-outlined text-sm align-middle">cancel</span>
                    Từ chối
                </button>
                <button onclick="showMuteDialog()" class="px-4 py-2 text-sm bg-danger text-white rounded-lg hover:bg-danger/90">
                    <span class="material-symbols-outlined text-sm align-middle">block</span>
                    Mute người dùng
                </button>
            </div>

            <div id="reject-reason-container" class="px-6 py-4 bg-warning/5 border-t border-warning/20" style="display: none;">
                <label class="block text-sm font-bold mb-2">Ly do từ chối:</label>
                <textarea id="reject-reason" rows="3" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-sm" placeholder="Nhap ly do tu choi bai viet..."></textarea>
                <div class="mt-3 flex gap-2">
                    <button onclick="submitReject()" class="px-4 py-2 text-sm bg-warning text-white rounded-lg">Xac nhận từ chối</button>
                    <button onclick="document.getElementById('reject-reason-container').style.display='none'" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Huy</button>
                </div>
            </div>

            <div id="mute-dialog" class="px-6 py-4 bg-danger/5 border-t border-danger/20" style="display: none;">
                <h4 class="text-sm font-bold mb-3">Mute người dùng</h4>
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium mb-1">Thời gian mute (gio):</label>
                        <select id="mute-duration" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-sm">
                            <option value="1">1 giờ</option>
                            <option value="6">6 giờ</option>
                            <option value="24">24 giờ (1 ngày)</option>
                            <option value="72">72 giờ (3 ngày)</option>
                            <option value="168">168 giờ (1 tuần)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Ly do:</label>
                        <textarea id="mute-reason" rows="2" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-sm" placeholder="Nhap lí do mute..."></textarea>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="submitMuteUser()" class="px-4 py-2 text-sm bg-danger text-white rounded-lg">Xac nhan Mute</button>
                        <button onclick="document.getElementById('mute-dialog').style.display='none'" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Hủy</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/user/js/config.js"></script>
    <script src="/admin/js/admin.js"></script>
    <script>
        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('darkModeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.textContent = 'dark_mode';
            } else {
                html.classList.add('dark');
                icon.textContent = 'light_mode';
            }
        }

        async function refreshQueueBadge() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE_URL}/moderation/posts?status=pending&per_page=1`, {
                    credentials: 'include',
                    headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                });
                const data = await response.json();
                document.getElementById('queueCount').textContent = data.total || 0;
            } catch (error) {
                console.error('Queue badge error:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const ok = await checkAuth();
            if (!ok) return;
            currentTab = 'dashboard';
            loadDashboard();
            refreshQueueBadge();
            setInterval(refreshQueueBadge, 30000);
        });
    </script>
</body>

</html>
